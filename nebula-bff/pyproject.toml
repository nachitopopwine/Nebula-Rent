[project]
name = "nebula-bff"
version = "1.0.0"
description = "BFF / API Gateway GraphQL de Nébula Rent"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60"

[tool.coverage.run]
source = ["app"]
omit = ["app/gen/*"]

[tool.ruff]
line-length = 110
