name: CI - nebula-infra (Kubernetes)

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kustomize y kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Renderizar y validar manifiestos
        run: |
          ./kustomize build k8s/overlays/local > render.yaml
          ./kubeconform -strict -summary render.yaml

  e2e-kind:
    # Levanta el clúster completo en kind con las imágenes publicadas en GHCR (manual).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - run: kubectl apply -k k8s/base && kubectl -n nebula-rent rollout status deploy --timeout=600s
