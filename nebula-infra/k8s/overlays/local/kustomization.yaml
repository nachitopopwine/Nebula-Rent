# Overlay para kind: usa las imágenes construidas localmente (tag "local").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - { name: ghcr.io/nebula-rent/nebula-bff, newTag: local }
  - { name: ghcr.io/nebula-rent/nebula-pilotos, newTag: local }
  - { name: ghcr.io/nebula-rent/nebula-reservas, newTag: local }
  - { name: ghcr.io/nebula-rent/nebula-pagos, newTag: local }
  - { name: ghcr.io/nebula-rent/nebula-clima-mcp, newTag: local }
  - { name: ghcr.io/nebula-rent/nebula-frontend, newTag: local }
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
