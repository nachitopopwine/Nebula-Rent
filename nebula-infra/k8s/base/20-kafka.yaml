# Kafka en modo KRaft (sin ZooKeeper), un nodo, suficiente para desarrollo.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: nebula-rent
spec:
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: nebula-rent
spec:
  clusterIP: None
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: nebula-rent
spec:
  serviceName: kafka-headless
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
# Crea los tópicos del sistema una vez que Kafka está arriba.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: nebula-rent
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.8.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              for t in reservas.creadas pagos.solicitados pagos.procesados; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                  --create --if-not-exists --topic "$t" --partitions 3 --replication-factor 1
              done
