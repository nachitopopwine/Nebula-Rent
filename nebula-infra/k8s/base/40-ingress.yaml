# Único punto de entrada externo: el frontend y el endpoint GraphQL del BFF.
# Los microservicios internos (gRPC, Kafka, REST del MCP) NO se exponen fuera del clúster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nebula-ingress
  namespace: nebula-rent
spec:
  ingressClassName: nginx
  rules:
    - host: nebula.localhost
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend: { service: { name: bff, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
