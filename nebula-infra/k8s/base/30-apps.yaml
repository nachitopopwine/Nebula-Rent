# ===================== BFF (Python / GraphQL / API Gateway) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: nebula-rent
  labels: { app: bff }
spec:
  replicas: 2
  selector: { matchLabels: { app: bff } }
  template:
    metadata: { labels: { app: bff } }
    spec:
      containers:
        - name: bff
          image: ghcr.io/nebula-rent/nebula-bff:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: nebula-config } }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: bff, namespace: nebula-rent }
spec:
  selector: { app: bff }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
# ===================== Pilotos (Go / gRPC / PostgreSQL) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilotos
  namespace: nebula-rent
  labels: { app: pilotos }
spec:
  replicas: 2
  selector: { matchLabels: { app: pilotos } }
  template:
    metadata: { labels: { app: pilotos } }
    spec:
      containers:
        - name: pilotos
          image: ghcr.io/nebula-rent/nebula-pilotos:latest
          ports: [{ containerPort: 50051 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: nebula-secrets, key: DATABASE_URL } }
            - { name: GRPC_PORT, value: "50051" }
          readinessProbe: { grpc: { port: 50051 }, periodSeconds: 5 }
          livenessProbe: { grpc: { port: 50051 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: pilotos, namespace: nebula-rent }
spec:
  selector: { app: pilotos }
  ports: [{ name: grpc, port: 50051, targetPort: 50051 }]
---
# ===================== Reservas (Java / gRPC / MySQL / Kafka) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas
  namespace: nebula-rent
  labels: { app: reservas }
spec:
  replicas: 1
  selector: { matchLabels: { app: reservas } }
  template:
    metadata: { labels: { app: reservas } }
    spec:
      containers:
        - name: reservas
          image: ghcr.io/nebula-rent/nebula-reservas:latest
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: http, containerPort: 8080 }
          envFrom: [{ configMapRef: { name: nebula-config } }]
          env:
            - { name: MYSQL_URL, value: "jdbc:mysql://mysql:3306/reservas?useSSL=false&allowPublicKeyRetrieval=true" }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: nebula-secrets, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: nebula-secrets, key: MYSQL_PASSWORD } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 60 }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata: { name: reservas, namespace: nebula-rent }
spec:
  selector: { app: reservas }
  ports:
    - { name: grpc, port: 9090, targetPort: 9090 }
    - { name: http, port: 8080, targetPort: 8080 }
---
