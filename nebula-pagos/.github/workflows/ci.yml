name: CI - nebula-pagos (.NET)

on:
  push: { branches: [main] }
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nebula-pagos

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore tests/NebulaPagos.Tests
      - name: Tests + coverlet (falla bajo 60% de líneas)
        run: dotnet test tests/NebulaPagos.Tests --no-restore --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: tests/NebulaPagos.Tests/TestResults }

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
