server:
  port: 8080

spring:
  application:
    name: nebula-reservas
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/reservas?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:reservas}
    password: ${MYSQL_PASSWORD:reservas-secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

nebula:
  grpc:
    port: ${GRPC_PORT:9090}
  pilotos:
    addr: ${PILOTOS_GRPC_ADDR:localhost:50051}
  kafka:
    topico-reservas: reservas.creadas
