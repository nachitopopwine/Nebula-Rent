name: CI - nebula-reservas (Java)

on:
  push: { branches: [main] }
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nebula-reservas

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests + JaCoCo (falla bajo 60% de líneas)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jacoco, path: target/site/jacoco }

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
